services:
  ollama:
    image: ollama/ollama:0.12.3
    # Sem porta publicada: o backend fala com ele pela rede interna do compose,
    # e assim não briga com um Ollama instalado direto na máquina (porta 11434).
    volumes:
      - ollama:/root/.ollama
    environment:
      # Em CPU, rodar várias narrações ao mesmo tempo só divide os núcleos entre elas.
      # Com 1, os pedidos fazem fila e cada um sai na velocidade máxima.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Baixa o modelo na primeira vez. Depois ele já está no volume e isso termina na hora.
  ollama-pull:
    image: ollama/ollama:0.12.3
    entrypoint: ["ollama", "pull", "gemma3:1b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      UMBRA_DATABASE_URL: sqlite:////data/umbra.db
      UMBRA_OLLAMA_URL: http://ollama:11434
    volumes:
      - umbra-data:/data  # o banco fica aqui pra não sumir quando o container é recriado
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      UMBRA_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  ollama:
  umbra-data:
